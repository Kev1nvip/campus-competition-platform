services:
  # ================================
  # PostgreSQL + PGVector
  # ================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: competition-postgres
    command: postgres -c 'timezone=PRC'
    environment:
      TZ: Asia/Shanghai
      POSTGRES_DB: ${DB_NAME:-campus_competition}
      POSTGRES_USER: ${DB_USERNAME:-competition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-competition123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-competition} -d ${DB_NAME:-campus_competition}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - competition-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ================================
  # Redis
  # ================================
  redis:
    image: redis:7.2-alpine
    container_name: competition-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6735:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - competition-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ================================
  # RabbitMQ
  # ================================
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: competition-rabbitmq
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-competition}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-competition123}
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - competition-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ================================
  # SpringBoot 后端
  # ================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: competition-backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # 数据库
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-campus_competition}
      DB_USERNAME: ${DB_USERNAME:-competition}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-competition123}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-campus_competition}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-competition}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-competition123}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      # RabbitMQ
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-competition}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-competition123}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-campus-competition-jwt-secret-key-2026}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7200}
      # 文件上传
      UPLOAD_PATH: ${UPLOAD_PATH:-/app/uploads}
      # AI配置
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY}
    # ports 移除 8080 暴露，仅容器内网访问
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - competition-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ================================
  # Nginx + 前端
  # ================================
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: competition-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - competition-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

# ================================
# 网络
# ================================
networks:
  competition-network:
    driver: bridge

# ================================
# 数据卷（绑定挂载到宿主机 /data）
# ================================
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/postgres
  uploads_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/uploads
